<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Name — Links</title>
    <meta name="description" content="Personal links." />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500&family=Outfit:wght@360;500&family=Unbounded:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=2026-11-12" />
  </head>
  <body>
    <div class="frame" aria-hidden="true"></div>
    <main class="page">
      <header class="top">
        <p class="status">
          <span class="dot" aria-hidden="true"></span>
          Available
        </p>
        <p class="meta"><a href="#work">Projects</a></p>
      </header>

      <div class="stage">
        <section class="intro">
          <p class="kicker">Personal site</p>
          <h1>Your Name</h1>
          <p class="tagline">
            A short line about what you make, study, or care about.
          </p>
          <p class="place">Add a city</p>
        </section>

        <nav class="links" aria-label="Personal links">
          <a class="row" href="#">
            <span class="idx">01</span>
            <span class="copy">
              <span class="label">GitHub</span>
              <span class="hint">github.com/you</span>
            </span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
          <a class="row" href="#">
            <span class="idx">02</span>
            <span class="copy">
              <span class="label">LinkedIn</span>
              <span class="hint">linkedin.com/in/you</span>
            </span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
          <a class="row" href="#">
            <span class="idx">03</span>
            <span class="copy">
              <span class="label">Email</span>
              <span class="hint">hello@example.com</span>
            </span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
          <a class="row" href="#">
            <span class="idx">04</span>
            <span class="copy">
              <span class="label">Resume</span>
              <span class="hint">PDF</span>
            </span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </nav>
      </div>

      <section class="work" id="work" aria-label="Projects">
        <div class="pj">
          <div class="pj-side">
            <h2 class="pj-side-head">Projects</h2>
            <ol class="pj-list" id="pj-list"></ol>
          </div>

          <article class="pj-center" id="pj-center" aria-live="polite">
            <div class="pj-info">
              <p class="pj-group" id="pj-group"></p>
              <h2 id="pj-title"></h2>
              <p class="pj-type" id="pj-type"></p>
              <p class="pj-summary" id="pj-summary"></p>
              <div class="pj-row">
                <ul class="pj-tags" id="pj-tags"></ul>
                <div class="pj-links" id="pj-links"></div>
              </div>
            </div>
            <div class="pj-media">
              <div class="pj-strip" id="pj-strip"></div>
              <p class="pj-caption" id="pj-caption"></p>
              <div class="pj-frame" id="pj-frame"></div>
            </div>
          </article>
        </div>
      </section>
    </main>

    <script src="projects.js?v=2026-11-12e"></script>
  </body>
</html>
